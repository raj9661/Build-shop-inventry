apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inventory-platform-ingress
  namespace: inventory-platform
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - inventory-platform.example.com
    secretName: inventory-platform-tls
  rules:
  - host: inventory-platform.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx-service
            port:
              number: 80

