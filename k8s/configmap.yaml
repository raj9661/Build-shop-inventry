apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: inventory-platform
data:
  NODE_ENV: "production"
  NEXT_TELEMETRY_DISABLED: "1"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  # Update these with your actual values
  NEXTAUTH_URL: "http://localhost:3000"
  # Note: Sensitive values should be in Secrets, not ConfigMap

